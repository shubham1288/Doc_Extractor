[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-document-extraction"
version = "0.1.0"
description = "Production-ready, stateless OCR-based KYC document extraction system for banking applications"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "KYC Team"},
]

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "gunicorn==23.0.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "paddleocr==2.9.1",
    "paddlepaddle==2.6.2",
    "opencv-python-headless==4.10.0.84",
    "numpy==1.26.4",
    "structlog==24.4.0",
    "pdf2image==1.17.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "pypdf==4.1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "hypothesis==6.122.3",
    "pytest-cov==6.0.0",
]

[project.scripts]
kyc-server = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/main.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
